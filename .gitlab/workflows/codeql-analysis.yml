name: CodeQL

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
    paths:
      - "src/**" # only trigger when files under src/ change
  schedule:
    - cron: "0 10 * * 1" # full repo scan every Monday at 10:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      actions: read # only required if this repository is private
      contents: read # required to check out the repository
      security-events: write # required to upload CodeQL results to the Security tab

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: "python"
            build-mode: none

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
